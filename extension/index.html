<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <title>FrameFlow 2.3</title><link rel="stylesheet" href="css/panel.css">
</head>
<body>
<svg class="svg-defs" aria-hidden="true"><defs>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5M5.5 8a7 7 0 0 1 11.7-3L20 8M4 16l2.8 3A7 7 0 0 0 18.5 16"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h16M4 17h16M8 4v6M16 14v6"/></symbol>
  <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 9a3 3 0 1 1 4 3c-1 .5-1 1-1 2M12 17v1"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path d="M20 12H4m6-6-6 6 6 6"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="M4 12h16m-6-6 6 6-6 6"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-gap" viewBox="0 0 24 24"><path d="M3 5v14M21 5v14M4 12h6m-3-3 3 3-3 3m13-3h-6m3-3-3 3 3 3"/></symbol>
  <symbol id="i-comp" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m10 9 5 3-5 3Z"/></symbol>
</defs></svg>
<main id="app">
<header class="topbar"><div class="brand"><span class="brand-mark"><i></i><i></i><i></i></span><strong>FrameFlow</strong><span class="version">2.3</span></div><span id="connection" class="connection">No AE</span><div class="header-actions">
<button id="refresh" class="icon-button" aria-label="Refresh from AE · R" data-label-en="Refresh from AE · R" data-label-ru="Обновить из AE · R"><svg><use href="#i-refresh"/></svg></button><button id="open-settings" class="icon-button" aria-label="Settings" data-label-en="Settings" data-label-ru="Настройки"><svg><use href="#i-settings"/></svg></button><button id="open-help" class="icon-button" aria-label="Help" data-label-en="Help" data-label-ru="Справка"><svg><use href="#i-help"/></svg></button></div></header>
<div class="content">
<div class="composition"><strong id="comp-name">No composition</strong><button id="scope" class="menu-trigger" aria-haspopup="menu" aria-expanded="false">Auto</button><button id="mode" class="menu-trigger" aria-haspopup="menu" aria-expanded="false">Layers + Keys</button></div>
<section class="frames-section" aria-label="Frame step" data-label-en="Frame step" data-label-ru="Шаг в кадрах"><div class="step-editor"><div class="number-stepper"><button id="frame-minus" aria-label="Decrease by 1 frame · Shift: 10" data-label-en="Decrease by 1 frame · Shift: 10" data-label-ru="Уменьшить на 1 кадр · Shift: 10">−</button><input id="frames" type="number" min="1" max="1000000" step="1" value="12" inputmode="numeric" aria-label="Frame step" data-label-en="Frame step" data-label-ru="Шаг в кадрах"><button id="frame-plus" aria-label="Increase by 1 frame · Shift: 10" data-label-en="Increase by 1 frame · Shift: 10" data-label-ru="Увеличить на 1 кадр · Shift: 10">+</button></div><input id="frame-slider" type="range" min="1" max="120" step="1" value="12" aria-label="Quick step: 1 to 120 frames" data-label-en="Quick step: 1 to 120 frames" data-label-ru="Быстрый шаг: от 1 до 120 кадров"></div><div class="quick-steps"><div id="presets" class="presets" aria-label="Quick frame steps" data-label-en="Quick frame steps" data-label-ru="Быстрые шаги в кадрах"></div><div class="time-presets"><button id="half-second" class="small-button" data-en="½ s" data-ru="½ с" aria-label="Half second, rounded to whole frames" data-label-en="Half second, rounded to whole frames" data-label-ru="Полсекунды с округлением до целых кадров">½ s</button><button id="one-second" class="small-button" data-en="1 s" data-ru="1 с" aria-label="One second, rounded to whole frames" data-label-en="One second, rounded to whole frames" data-label-ru="Секунда с округлением до целых кадров">1 s</button></div></div></section>
<section class="side-actions" aria-label="Shift relative to AE cursor" data-label-en="Shift relative to AE cursor" data-label-ru="Сдвиг относительно курсора AE">
<div class="side-group"><h2 data-en="Before cursor" data-ru="До курсора">Before cursor</h2><div class="action-pair"><button id="before-minus" data-offset="before:-1" class="shift-button"><span class="shift-value"><svg aria-hidden="true"><use href="#i-left"/></svg><span class="step-value">12</span></span></button><button id="before-plus" data-offset="before:1" class="shift-button"><span class="shift-value"><span class="step-value">12</span><svg aria-hidden="true"><use href="#i-right"/></svg></span></button></div></div>
<div class="side-group"><h2 data-en="After cursor" data-ru="После курсора">After cursor</h2><div class="action-pair"><button id="after-minus" data-offset="after:-1" class="shift-button"><span class="shift-value"><svg aria-hidden="true"><use href="#i-left"/></svg><span class="step-value">12</span></span></button><button id="after-plus" data-offset="after:1" class="shift-button"><span class="shift-value"><span class="step-value">12</span><svg aria-hidden="true"><use href="#i-right"/></svg></span></button></div></div>
</section><div class="utility-row"><button id="gap" class="secondary-button"><svg aria-hidden="true"><use href="#i-gap"/></svg><span data-en="Close Gap" data-ru="Убрать паузу">Close Gap</span></button><div class="utility-menus"><button id="time-menu" class="quiet-button" aria-haspopup="menu" aria-expanded="false"><span data-en="Time" data-ru="Время">Time</span><svg aria-hidden="true"><use href="#i-chevron"/></svg></button><button id="preview-plan" class="quiet-button" aria-haspopup="menu" aria-expanded="false"><span data-en="Plan" data-ru="План">Plan</span><svg aria-hidden="true"><use href="#i-chevron"/></svg></button></div></div>
<p id="empty-text" class="empty-note" data-en="Open a composition in AE." data-ru="Откройте композицию в AE.">Open a composition in AE.</p><button id="demo" class="secondary-button" data-en="Try Demo" data-ru="Посмотреть демо" hidden>Try Demo</button></div>
<footer class="statusbar"><span id="status-icon" class="status-dot"></span><span id="status" role="status" aria-live="polite">Connecting to AE…</span><button id="open-report" class="quiet-button" data-en="Report" data-ru="Отчёт" aria-label="Open and copy report" data-label-en="Open and copy report" data-label-ru="Открыть и скопировать отчёт">Report</button></footer></main>
<div id="menu" class="popup-menu" role="menu" hidden></div><div id="overlay" class="overlay" hidden><section id="dialog" class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title" tabindex="-1"><header><strong id="dialog-title"></strong><button id="close-dialog" class="icon-button" aria-label="Close dialog" data-label-en="Close dialog" data-label-ru="Закрыть окно"><svg><use href="#i-close"/></svg></button></header><div id="dialog-body" class="dialog-body"></div></section></div><input id="import-file" type="file" accept="application/json,.json" hidden>
<script src="js/i18n.js"></script><script src="js/model.js"></script><script src="js/bridge.js"></script><script src="js/demo.js"></script><script src="js/panel.js"></script></body></html>
