<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <title>FrameFlow 2.1</title><link rel="stylesheet" href="css/panel.css">
</head>
<body>
<svg class="svg-defs" aria-hidden="true"><defs>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5M5.5 8a7 7 0 0 1 11.7-3L20 8M4 16l2.8 3A7 7 0 0 0 18.5 16"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h16M4 17h16M8 4v6M16 14v6"/></symbol>
  <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 9a3 3 0 1 1 4 3c-1 .5-1 1-1 2M12 17v1"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
</defs></svg>
<main id="app">
  <header class="topbar"><div class="brand"><span class="brand-mark"><i></i><i></i><i></i></span><strong>FrameFlow</strong><span class="version">2.1</span></div><span id="connection" class="connection">Нет AE</span><div class="header-actions"><button id="refresh" class="icon-button" aria-label="Обновить из AE" title="Обновить из AE · R"><svg><use href="#i-refresh"/></svg></button><button id="open-settings" class="icon-button" aria-label="Настройки" title="Настройки"><svg><use href="#i-settings"/></svg></button><button id="open-help" class="icon-button" aria-label="Как работает" title="Как работает"><svg><use href="#i-help"/></svg></button></div></header>
  <div class="content">
    <div class="composition"><strong id="comp-name">Нет композиции</strong><span id="cti-label" class="muted">Курсор AE —</span></div>
    <section class="scope-section" aria-label="Область действия"><div class="segmented scope-options"><button data-scope="auto" title="Выделенные в AE; без выделения — все слои" aria-pressed="true">Авто</button><button data-scope="selected" title="Только выделенные в AE слои" aria-pressed="false">Выделенные</button><button data-scope="all" title="Все слои композиции, независимо от выделения" aria-pressed="false">Все слои</button></div><p id="scope-hint" class="hint">Авто: выделенные; без выделения — все слои.</p></section>
    <section class="frames-section" aria-label="Шаг переноса"><div class="step-editor"><label for="frames" class="step-label">Кадры</label><div class="number-stepper"><button id="frame-minus" aria-label="Уменьшить шаг на кадр" title="−1 кадр · Shift: −10">−</button><input id="frames" type="number" min="1" max="1000000" step="1" value="12" inputmode="numeric" aria-label="Шаг переноса в кадрах"><button id="frame-plus" aria-label="Увеличить шаг на кадр" title="+1 кадр · Shift: +10">+</button></div><input id="frame-slider" type="range" min="1" max="120" step="1" value="12" aria-label="Быстрый выбор шага от 1 до 120 кадров"></div><div class="quick-steps"><div id="presets" class="presets" aria-label="Быстрые шаги"></div><div class="time-presets"><span id="step-duration" class="muted" title="Длительность шага"></span><button id="half-second" class="small-button" title="Округлить половину секунды до целого числа кадров">½ с</button><button id="one-second" class="small-button" title="Округлить одну секунду до целого числа кадров">1 с</button></div></div></section>
    <section class="mode-section"><div class="mode-line"><span class="muted">Переносить</span><button id="mode" class="menu-trigger" aria-haspopup="menu" aria-expanded="false">Слои и ключи</button></div><p id="mode-note" class="hint"></p></section>
    <section class="side-actions" aria-label="Перенос относительно курсора AE" title="− назад по времени · + вперёд"><div class="side-group"><h2>До курсора</h2><div class="action-pair"><button id="before-minus" data-offset="before:-1" class="shift-button"><span class="sign">−</span><span class="step-value">12</span></button><button id="before-plus" data-offset="before:1" class="shift-button"><span class="sign">+</span><span class="step-value">12</span></button></div></div><div class="side-group"><h2>После курсора</h2><div class="action-pair"><button id="after-minus" data-offset="after:-1" class="shift-button"><span class="sign">−</span><span class="step-value">12</span></button><button id="after-plus" data-offset="after:1" class="shift-button"><span class="sign">+</span><span class="step-value">12</span></button></div></div></section>
    <div class="utility-row"><button id="gap" class="secondary-button" title="Удалить пустой промежуток под курсором в выбранной области">Убрать паузу</button><button id="preview-plan" class="quiet-button" title="Показать расчёт последнего направления без изменения AE">Проверить: После +</button></div>
    <p id="empty-text" class="empty-note">Откройте композицию в AE.</p><button id="demo" class="secondary-button" hidden>Посмотреть демо</button>
  </div>
  <footer class="statusbar"><span id="status-icon" class="status-dot"></span><span id="status" role="status" aria-live="polite">Подключение к AE…</span><button id="open-report" class="quiet-button" title="Открыть и скопировать отчёт">Отчёт</button></footer>
</main>
<div id="menu" class="popup-menu" role="menu" hidden></div>
<div id="overlay" class="overlay" hidden><section id="dialog" class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title" tabindex="-1"><header><strong id="dialog-title"></strong><button id="close-dialog" class="icon-button" aria-label="Закрыть окно"><svg><use href="#i-close"/></svg></button></header><div id="dialog-body" class="dialog-body"></div></section></div>
<input id="import-file" type="file" accept="application/json,.json" hidden>
<script src="js/model.js"></script><script src="js/bridge.js"></script><script src="js/demo.js"></script><script src="js/panel.js"></script>
</body></html>
