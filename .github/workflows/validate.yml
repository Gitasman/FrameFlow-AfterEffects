name: Validate and package FrameFlow

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up maintainer Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check source and build verified ZIP
        run: python3 tools/package.py --output-dir artifacts
      - name: Check generated source is current
        run: git diff --exit-code -- extension/jsx/host.jsx PREVIEW.html
      - name: Upload checked build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FrameFlow-AE-2.1.0-checked-build
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

