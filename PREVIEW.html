  function showHelp(){openDialog(t('How FrameFlow Works','Как работает FrameFlow'),'<p class="help-text"><strong>'+t('1. Place the cursor in AE.','1. Поставьте курсор в таймлайне AE.')+'</strong><br>'+t('Choose a frame step using presets, slider or − / +. Shift changes it by 10; the wheel works over the focused number.','Выберите шаг кнопкой, ползунком или − / +. Shift меняет шаг на 10 кадров; колесо работает над активным числом.')+'</p><p class="help-text"><strong>'+t('2. Scope defaults to Auto.','2. По умолчанию — Авто.')+'</strong><br>'+t('Auto uses selected AE layers, or all layers when none are selected. Selected never expands an empty selection.','Авто использует выделенные в AE слои; без выделения — всю композицию. «Выделенные» без выделения не расширяет область.')+'</p><p class="help-text"><strong>'+t('3. Choose Before or After cursor, then an arrow.','3. Выберите До или После курсора и стрелку.')+'</strong><br>'+t('Left moves earlier; right moves later. Before excludes a key at the cursor; After includes it. Each action reads the current AE cursor and selection.','Влево — раньше, вправо — позже. «До» не включает ключ на курсоре; «После» включает. Перед действием курсор и выделение перечитываются из AE.')+'</p><p class="help-text">'+Object.keys(modeNames()).map(k=>'<strong>'+esc(modeNames()[k])+':</strong> '+esc(modeNotes()[k])).join('<br>')+'</p><p class="help-text"><strong>'+t('Close Gap','Убрать паузу')+'</strong> — '+t('removes the empty gap under the cursor, independent of step and mode. Plan offers a preview for any direction or Close Gap. Apply Plan executes only the checked targets.','удаляет пустой промежуток под курсором независимо от шага и режима. Меню «План» проверяет любое направление или удаление паузы. «Применить план» выполняет только проверенные изменения.')+'</p><p class="help-text"><strong>'+t('Time → Insert / Remove','Время → Вставить / Удалить')+'</strong> — '+t('shifts later layers by the frame step. Keep leaves crossing layers intact; Retime Animation changes eligible animation only. Footage crossings need a manual AE split. No layers or keys are deleted; composition duration stays unchanged. Always preview the interval before applying.','сдвигает последующие слои на выбранный шаг. «Оставить» сохраняет пересекающие слои целиком. «Изменить анимацию» меняет только доступную анимацию. Видео и аудио на пересечении требуют ручного разделения в AE. Слои и ключи не удаляются; длительность композиции не меняется. Перед применением всегда показывается план.')+'</p><p class="help-text">'+t('Insufficient video handles keep that entire layer in place by default. Settings can cancel the entire operation instead. Locked targets and key collisions block writing. Undo / Redo in AE. R refreshes; ? opens Help. Report opens and copies the diagnostics.','Если исходных кадров не хватает, весь этот слой по умолчанию остаётся на месте. В настройках можно выбрать «Отменить всё». Блокировки и коллизии ключей запрещают запись. Undo / Redo выполняйте в AE. R обновляет сведения; ? открывает справку. «Отчёт» открывает и копирует диагностику.')+'</p>');}

    document.addEventListener('keydown',safe(keydown));document.addEventListener('pointerdown',e=>{if(menuOwner&&!$('menu').contains(e.target)&&!menuOwner.contains(e.target))closeMenu();});window.addEventListener('resize',closeMenu);window.addEventListener('focus',()=>{if(!busy&&$('overlay').hidden)refresh(true);});document.addEventListener('visibilitychange',schedulePoll);
    window.addEventListener('beforeunload',()=>{disposed=true;clearTimeout(pollTimer);clearTimeout(saveTimer);try{preferenceStore.save(prefs);}catch(e){}bridge.dispose();});render();schedulePoll();if(saveError)status(saveError,true);
  }
